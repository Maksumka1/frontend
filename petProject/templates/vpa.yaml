apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend-deployment
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  updatePolicy:
    updateMode: "Auto"  
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        minAllowed:
          cpu: 138m
          memory: 256Mi        
        maxAllowed:
          cpu: 1000m
          memory: 2Gi         
